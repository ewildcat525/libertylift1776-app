<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#10100F" />
    <title>Liberty Lift 1776</title>
  </head>
  <body style="margin:0;background:#10100F;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif">
    <main style="min-height:100vh;display:grid;place-items:center;text-align:center;padding:calc(24px + env(safe-area-inset-top)) calc(24px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));box-sizing:border-box">
      <div style="max-width:320px">
        <div aria-hidden="true" style="width:48px;height:48px;display:grid;place-items:center;margin:0 auto 18px;border-radius:14px;background:#D32331;font-size:20px;font-weight:800">LL</div>
        <h1 style="margin:0 0 8px;font-size:24px">Liberty Lift 1776</h1>
        <p id="status" role="status" aria-live="polite" style="margin:0;color:#a8a8b3;line-height:1.5">Connecting to the challenge…</p>
        <button id="retry" type="button" hidden style="min-height:48px;margin-top:22px;padding:0 24px;border:0;border-radius:12px;background:#D32331;color:#fff;font:700 15px -apple-system,BlinkMacSystemFont,sans-serif">Try again</button>
      </div>
    </main>
    <script>
      (() => {
        const origin = 'https://libertylift1776.com'
        const productionUrl = origin + '/'
        const status = document.getElementById('status')
        const retry = document.getElementById('retry')
        let checking = false

        const hideSplash = () => {
          window.Capacitor?.Plugins?.SplashScreen?.hide().catch(() => undefined)
        }

        const showUnavailable = () => {
          status.textContent = 'You appear to be offline. Reconnect to load live progress and logging.'
          retry.hidden = false
          hideSplash()
        }

        // When iOS cold-launches the app from a shared link, the destination
        // arrives as the launch URL. Landing on the homepage and only then
        // letting the web app correct itself costs a whole extra page load,
        // and shows the wrong screen while it happens. Resolve the target up
        // front instead and go straight there.
        //
        // Auth callbacks are the deliberate exception: the PKCE verifier lives
        // in this WebView's storage, so the code must be exchanged by the web
        // app on the client. Navigating to the HTTPS callback would hand it to
        // the server, which has no verifier. Those launches load the app
        // normally and NativeBridge completes the exchange.
        const targetFromLaunchUrl = (value) => {
          try {
            const url = new URL(value)
            let path = ''

            if (url.protocol === 'https:' && url.hostname.endsWith('libertylift1776.com')) {
              path = url.pathname + url.search + url.hash
            } else if (url.protocol === 'libertylift1776:') {
              const host = url.hostname && url.hostname !== 'open' ? '/' + url.hostname : ''
              const rest = url.pathname === '/' ? '' : url.pathname
              path = host + rest + url.search + url.hash
            }

            if (!path || !path.startsWith('/') || path.startsWith('//')) return null
            if (path.startsWith('/auth')) return null
            return origin + path
          } catch {
            return null
          }
        }

        const resolveTarget = async () => {
          const app = window.Capacitor?.Plugins?.App
          if (!app?.getLaunchUrl) return productionUrl
          try {
            // Never let a slow or missing bridge hold up the launch.
            const launch = await Promise.race([
              app.getLaunchUrl(),
              new Promise((resolve) => window.setTimeout(() => resolve(null), 1200)),
            ])
            return (launch?.url && targetFromLaunchUrl(launch.url)) || productionUrl
          } catch {
            return productionUrl
          }
        }

        const connect = async () => {
          if (checking) return
          checking = true
          retry.hidden = true
          status.textContent = 'Connecting to the challenge…'

          if (!navigator.onLine) {
            checking = false
            showUnavailable()
            return
          }

          const target = await resolveTarget()
          const controller = new AbortController()
          const timeout = window.setTimeout(() => controller.abort(), 8000)
          try {
            // Probe the origin, not the target. A shared link can point at a
            // handle that no longer exists, and a 404 there means the service
            // is up — it must not be reported to the patriot as being offline.
            const response = await fetch(productionUrl, {
              method: 'HEAD',
              cache: 'no-store',
              signal: controller.signal,
            })
            if (!response.ok) throw new Error('Service unavailable')
            window.location.replace(target)
          } catch {
            checking = false
            showUnavailable()
          } finally {
            window.clearTimeout(timeout)
          }
        }

        retry.addEventListener('click', connect)
        window.addEventListener('online', connect)
        window.addEventListener('offline', showUnavailable)
        void connect()
      })()
    </script>
  </body>
</html>
